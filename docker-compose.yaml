# MySportWeb: the frontend (nginx) on MSW_HTTP_PORT, the API behind it, and an optional Postgres.
#
# With the bundled database:  COMPOSE_PROFILES=db in .env (or --profile db on each command)
# With an external database:  no profile, MSW_DBHOST & co pointing to it (see compose.env.sample)
#
# The variables are prefixed MSW_: the .env of the backend for development (DBHOST=127.0.0.1...)
# is read by docker compose too and must not configure the containers.
#
# The data is in MSW_DATA_DIR (./data): media/ (FIT files, thumbnails, pictures, elevation and map tiles) and
# postgres/ (the bundled database); the dumps of the database in MSW_BACKUP_DIR (./backups). With Portainer,
# absolute paths: the relative ones are inside the stack directory of Portainer.
#
# The images are pulled from MSW_REGISTRY, version MSW_TAG (both images share it: see Releases in the README);
# this file never builds them: Portainer can't build. To build them here instead (MSW_TAG=dev for instance):
#   docker compose -f docker-compose.yaml -f docker-compose.build.yaml up --build
name: mysportweb

services:
  backend:
    # a version, never latest: an upgrade may migrate the database, which the previous version then refuses
    image: ${MSW_REGISTRY:-ghcr.io/oupsman}/mysportwebgo:${MSW_TAG:?set MSW_TAG, the version to deploy (X.Y.Z)}
    # a moving tag (1.2, latest) must not keep an old local copy
    pull_policy: always
    restart: unless-stopped
    # a stop lets the running requests finish (90 s at most) and the backfills stop at their next activity
    # (30 s): docker kills after 10 s by default
    stop_grace_period: 2m30s
    # the hard memory limit of the backend: above it, the kernel kills the backend (restarted by docker), never
    # the database. The backend reads it at its start: Go's garbage collector works harder at 85% of it, and
    # 2 files are analysed at a time under 2g, 4 from 2g. 1g handles the largest files accepted.
    mem_limit: ${MSW_BACKEND_MEMORY:-1g}
    environment:
      DBHOST: ${MSW_DBHOST:-db}
      DBPORT: ${MSW_DBPORT:-5432}
      DBUSER: ${MSW_DBUSER:-mysportweb}
      DBPASSWORD: ${MSW_DBPASSWORD:?set MSW_DBPASSWORD}
      DBNAME: ${MSW_DBNAME:-mysportweb}
      # prefer: TLS when the database offers it, the bundled one doesn't
      DBSSLMODE: ${MSW_DBSSLMODE:-prefer}
      SECRET_KEY: ${MSW_SECRET_KEY:?set MSW_SECRET_KEY, at least 32 random bytes signing the sessions}
      # empty: the loopback and the private networks
      TRUSTED_PROXIES: ${MSW_TRUSTED_PROXIES:-}
      # the public URL of the app: the API refuses the requests of any other origin
      DOMAIN: ${MSW_DOMAIN:?set MSW_DOMAIN, the URL users open, e.g. https://sport.example.com}
      LISTEN_PORT: "8080"
      # who may create an account: closed (default: nobody but the first admin, with the setup code of the
      # logs), invite (with an invitation of an admin) or open (anyone)
      REGISTRATION: ${MSW_REGISTRATION:-closed}
      # the storage quota of each user (their activities, thumbnails, pictures): 1g by default, none for no
      # quota. An admin gives a user another one in the admin page
      USER_QUOTA: ${MSW_USER_QUOTA:-1g}
      # the emails, through the SMTP relay of a sending service (see Emails in the README); empty: no email.
      # An incomplete configuration stops the backend at its start, saying what is missing
      SMTP_HOST: ${MSW_SMTP_HOST:-}
      SMTP_PORT: ${MSW_SMTP_PORT:-}
      SMTP_USERNAME: ${MSW_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${MSW_SMTP_PASSWORD:-}
      SMTP_TLS: ${MSW_SMTP_TLS:-}
      MAIL_FROM: ${MSW_MAIL_FROM:-}
      # the elevation tiles of the altitude correction, kept in MEDIA/dem: empty downloads the missing ones
      # from AWS Terrain Tiles, none only uses the ones put there
      DEM_URL: ${MSW_DEM_URL:-}
      # the map tiles of the thumbnails, kept in MEDIA/tiles: empty downloads them from OpenStreetMap, none
      # only uses the ones put there (the thumbnails are then drawn without map)
      MAP_TILE_URL: ${MSW_MAP_TILE_URL:-}
      # the weather at the start of the activities: empty asks Open-Meteo (free for a non-commercial use, the
      # start point rounded to about 10 km), none for no weather, else a self-hosted Open-Meteo
      WEATHER_URL: ${MSW_WEATHER_URL:-}
      # the metrics for Prometheus, on their own port (never through the frontend), see Monitoring in the
      # README; METRICS_TOKEN: the bearer token the scrapes must send, empty for none
      METRICS_PORT: "9090"
      METRICS_TOKEN: ${MSW_METRICS_TOKEN:-}
      # the age of the last backup of the backup service, in the metrics
      BACKUP_DIR: /backups
    ports:
      # the metrics: on the docker host only by default; MSW_METRICS_ADDRESS=0.0.0.0:9090 for a Prometheus on
      # another machine, with MSW_METRICS_TOKEN
      - "${MSW_METRICS_ADDRESS:-127.0.0.1:9090}:9090"
    volumes:
      # the uploaded FIT files, thumbnails, pictures, elevation and map tiles
      - ${MSW_DATA_DIR:-./data}/media:/app/MEDIA
      # read only: the backups, for the metrics (readable when MSW_BACKUP_OWNER is the user of the backend,
      # 1000:1000 by default)
      - ${MSW_BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        # absent with an external database
        required: false

  # Gives the media directory to the user of the backend (uid 1000) before it starts: docker creates a missing
  # directory as root. The image of the backend, run once as root.
  init:
    image: ${MSW_REGISTRY:-ghcr.io/oupsman}/mysportwebgo:${MSW_TAG:?set MSW_TAG, the version to deploy (X.Y.Z)}
    pull_policy: always
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - '[ "$$(stat -c %u:%g /app/MEDIA)" = 1000:1000 ] || chown -R 1000:1000 /app/MEDIA'
    volumes:
      - ${MSW_DATA_DIR:-./data}/media:/app/MEDIA

  frontend:
    image: ${MSW_REGISTRY:-ghcr.io/oupsman}/mysportweb-frontend:${MSW_TAG:?set MSW_TAG, the version to deploy (X.Y.Z)}
    pull_policy: always
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      # Content-Security-Policy (default): the browser blocks what the policy doesn't allow (a script injected
      # in a page). Content-Security-Policy-Report-Only only reports it in the browser console: to try a change
      # of the policy, or a page it would break
      CSP_HEADER: ${MSW_CSP_HEADER:-Content-Security-Policy}
    ports:
      - "${MSW_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Nightly dump of the database into MSW_BACKUP_DIR, to back up elsewhere with MSW_DATA_DIR/media (a backup of
  # the machine after MSW_BACKUP_TIME, or of these files, see the README). A backup now (before an upgrade):
  # docker compose run --rm backup now. The restore: see the README.
  backup:
    # pg_dump can't dump a server more recent than itself: the major version of the database
    image: ${MSW_BACKUP_IMAGE:-postgres:16-trixie}
    restart: unless-stopped
    environment:
      PGHOST: ${MSW_DBHOST:-db}
      PGPORT: ${MSW_DBPORT:-5432}
      PGUSER: ${MSW_DBUSER:-mysportweb}
      PGPASSWORD: ${MSW_DBPASSWORD:?set MSW_DBPASSWORD}
      PGDATABASE: ${MSW_DBNAME:-mysportweb}
      PGSSLMODE: ${MSW_DBSSLMODE:-prefer}
      # the time of the nightly backup, HH:MM in TZ
      BACKUP_TIME: ${MSW_BACKUP_TIME:-03:30}
      TZ: ${MSW_BACKUP_TZ:-Europe/Paris}
      # the dumps older than that are deleted, once a new one succeeded
      BACKUP_KEEP_DAYS: ${MSW_BACKUP_KEEP_DAYS:-14}
      # uid:gid owning the backups, readable by it only: the user of the tool sending them elsewhere
      BACKUP_OWNER: ${MSW_BACKUP_OWNER:-1000:1000}
    volumes:
      - ${MSW_BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - bash
      - -c
      - |
        set -u
        umask 077
        # PID 1 ignores SIGTERM without a handler: docker stop would wait, then kill a dump midway
        trap 'log "stopped"; exit 0' TERM INT
        log() { echo "$$(date '+%F %T') $$*"; }
        if ! date -d "today $$BACKUP_TIME" > /dev/null 2>&1; then
          log "ERROR: BACKUP_TIME must be HH:MM, not $$BACKUP_TIME"
          exit 1
        fi
        mkdir -p /backups/db

        # backup dumps the database, checks the dump, then deletes the old dumps
        backup() {
          local name="/backups/db/$$PGDATABASE-$$(date +%F_%H%M%S).dump"
          log "dumping $$PGDATABASE from $$PGHOST:$$PGPORT"
          # a dump is written under another name until checked: a stopped or failed dump is never a backup
          if ! pg_dump --format=custom --file="$$name.partial"; then
            log "ERROR: pg_dump failed"
            rm -f "$$name.partial"
            return 1
          fi
          if ! pg_restore --list "$$name.partial" > /dev/null; then
            log "ERROR: the dump can't be read back"
            rm -f "$$name.partial"
            return 1
          fi
          mv "$$name.partial" "$$name"
          log "database dumped: $$name ($$(du -h "$$name" | cut -f1))"
          # only after a successful dump: failing backups never delete the last good ones
          find /backups/db -name '*.dump' -mtime "+$$BACKUP_KEEP_DAYS" -print -delete | sed 's/^/deleted /'
          find /backups/db -name '*.partial' -mmin +1440 -delete
          # the dumps hold the traces (the homes of the users) and the password hashes: the owner only
          chown -R "$$BACKUP_OWNER" /backups
          chmod -R go= /backups
          touch /backups/.last-success
        }

        # a successful backup in the last 26 hours: what the health check tells
        recent() { [ -n "$$(find /backups/.last-success -mmin -1560 2>/dev/null)" ]; }

        if [ "$${1:-schedule}" = now ]; then
          backup
          exit
        fi
        # a backup at the start unless there is a recent one: the first deployment, a long stop
        if [ -z "$$(find /backups/.last-success -mmin -1200 2>/dev/null)" ]; then
          backup || true
        fi
        retry=$${BACKUP_RETRY_SECONDS:-300}
        while :; do
          now=$$(date +%s)
          next=$$(date -d "today $$BACKUP_TIME" +%s)
          if [ "$$next" -le "$$now" ]; then
            next=$$(date -d "tomorrow $$BACKUP_TIME" +%s)
          fi
          # without a recent backup (the one of the start or of the night failed: the database not ready,
          # unreachable), tried again every few minutes rather than the next night
          if ! recent && [ $$((now + retry)) -lt "$$next" ]; then
            next=$$((now + retry))
          fi
          log "next backup at $$(date -d "@$$next" '+%F %T %Z')"
          sleep $$((next - now)) &
          wait $$!
          backup || true
        done
      - backup
    command: ["schedule"]
    # unhealthy when the last successful backup is more than 26 hours old. Healthy as soon as the backup of the
    # start succeeds (checked every 10 s meanwhile, Docker 25+); unhealthy after 30 min without backup.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups/.last-success -mmin -1560 2>/dev/null)\""]
      interval: 5m
      timeout: 10s
      start_period: 30m
      start_interval: 10s
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    # bookworm, not trixie like the others: another glibc sorts the text differently, the indexes of an existing
    # database would need a REINDEX. Moving to trixie: through a dump and its restore (see the README).
    image: postgres:16-bookworm
    profiles: [db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MSW_DBUSER:-mysportweb}
      POSTGRES_PASSWORD: ${MSW_DBPASSWORD:?set MSW_DBPASSWORD}
      POSTGRES_DB: ${MSW_DBNAME:-mysportweb}
    volumes:
      # created by postgres at its first start, owned by its user (uid 999)
      - ${MSW_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
